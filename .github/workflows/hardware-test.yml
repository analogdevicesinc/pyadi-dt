name: Hardware Tests

# Triggered by:
#   * workflow_dispatch (manual)
#   * push to `main` — validate hardware on every landed change
#   * PRs labeled `hw-test` — keeps every push from burning lab time
#   * Nightly cron at 08:00 UTC
#
# Dynamic mode: the matrix is discovered from the coordinator at preflight
# and gated by .github/supported-boards.yml; one leg per matching place. The
# reusable workflow is vendored locally for pre-acquisition kernel preparation.

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      kuiper_release:
        description: >-
          Run against another Kuiper release's design (XSA, bitstream or
          BOOT.BIN, and matching kernel) instead of each test's pinned one.
          Only the rigs in .github/supported-boards-2026r1.yml take part.
        type: choice
        default: ""
        options: ["", "2026_r1"]
  push:
    branches: [main]
  pull_request:
    types: [labeled, opened, synchronize, reopened]
  schedule:
    - cron: "0 8 * * *"

jobs:
  hardware:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'hw-test')
    uses: ./.github/workflows/hw-matrix.yml
    with:
      dynamic_mode: true
      timeout_minutes: 120
      # Runner routing is owned entirely by the coordinator: each place's
      # `runner` tag selects its self-hosted runner. No in-repo runner names.
      supported_boards_path: >-
        ${{ inputs.kuiper_release == '2026_r1' && '.github/supported-boards-2026r1.yml'
        || '.github/supported-boards.yml' }}
      cim_release: ${{ inputs.kuiper_release == '2026_r1' && '2026-R1' || '' }}
      venv_install_cmd: 'bash .github/scripts/install-adidt-venv.sh'
      venv_dir: $HOME/.cache/adidt-ci/datax-py312-venv
      # Dynamic mode exports $BOARD + $CARRIER (no manifest test list). Select
      # this place's full-DTB and runtime-overlay tests by filename convention
      # (e.g. daq3 matches fmcdaq3_vcu118), excluding slow PetaLinux builds.
      # A release run stages that release's boot files first and leaves out the
      # runtime-overlay tests, whose prebuilt modular kernels are release-bound.
      # The labgrid pytest plugin reads LG_ENV / LG_COORDINATOR from the env.
      pytest_cmd_template: >-
        set -euo pipefail;
        export ADIDT_KUIPER_RELEASE="${{ inputs.kuiper_release }}";
        SKIP_TESTS=no-such-test;
        if [ -n "$ADIDT_KUIPER_RELEASE" ]; then
        BOOT_EXPORTS=$("$VENV_DIR/bin/python" .github/scripts/prepare_kuiper_boot_files.py
        --release "$ADIDT_KUIPER_RELEASE" --board "$BOARD" --carrier "$CARRIER"
        --cache "$HOME/.cache/adidt/kuiper" --output "$(mktemp -d)");
        eval "$BOOT_EXPORTS";
        SKIP_TESTS=_overlay.py;
        fi;
        source .github/scripts/prepare-hardware-env.sh;
        TESTS=$( { find test/hw -maxdepth 1 -type f -name "*${BOARD}*${CARRIER}*_hw.py";
        find test/hw/xsa -maxdepth 1 -type f -name "test_*${BOARD}*${CARRIER}*_overlay.py"; }
        | grep -v petalinux | grep -v "$SKIP_TESTS" | sort -u | tr '\n' ' ');
        if [ -z "$TESTS" ]; then echo "::error::no pyadi-dt HW tests for board=$BOARD carrier=$CARRIER"; exit 1; fi;
        echo "Selected: $TESTS" >&2;
        "$VENV_DIR/bin/pytest" -p no:genalyzer -v -s $TESTS --junitxml="$JUNIT";
        "$VENV_DIR/bin/python" .github/scripts/check_hardware_results.py "$JUNIT"
      artifact_glob: |
        test/hw/output/**/*.dts
        test/hw/output/**/*.pp.dts
        test/hw/output/**/*.dtb
        test/hw/output/**/*.dtbo
        test/hw/output/**/*.log
        test/hw/output/**/uart_log_*.txt
        uart_log_*.txt
        junit-hw-*.xml
      prism_project: pyadi-dt
      prism_upload: ${{ vars.PRISM_UPLOAD_ENABLED == 'true' }}
      # Vendored tfcollins/prism uploader (private repo; can't pip-install on
      # the runner). The reusable workflow exports PRISM_URL/EMAIL/PASSWORD/
      # PROJECT/JUNIT/RUN_NAME/BOARD/CARRIER/PLACE.
      prism_upload_cmd: >-
        python3 .github/scripts/prism_upload_run.py "$PRISM_JUNIT"
        --url "$PRISM_URL" --project "$PRISM_PROJECT" --run-name "$PRISM_RUN_NAME"
        --auto-create-project
        --tag "board=$PRISM_BOARD" --tag "carrier=$PRISM_CARRIER"
        --tag "place=$PRISM_PLACE" --tag "sha=$GITHUB_SHA"
    secrets:
      PRISM_EMAIL: ${{ secrets.PRISM_EMAIL }}
      PRISM_PASSWORD: ${{ secrets.PRISM_PASSWORD }}
