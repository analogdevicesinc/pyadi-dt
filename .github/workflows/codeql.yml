name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Vendored device-tree binding headers are data fixtures, not C/C++
        # build targets. Keep the release analysis language set explicit.
        language: [actions, python]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
