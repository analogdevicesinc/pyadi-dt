name: Test and Build Package

permissions:
  contents: read
  # `dorny/test-reporter` creates a GitHub Check Run per pytest
  # matrix leg with the per-test detail from the JUnit XML.
  checks: write
  pull-requests: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '20[1-9][0-9]_R[1-9]'
      - 'staging/*'
  pull_request:
    branches:
      - '**'

jobs:
  python-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    name: Test Python ${{ matrix.python-version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[test]"

    - name: Run tests with pytest
      run: |
        pytest -vs --junitxml=junit-py${{ matrix.python-version }}.xml

    - name: Upload JUnit XML
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: junit-py${{ matrix.python-version }}
        path: junit-py${{ matrix.python-version }}.xml
        retention-days: 14
        if-no-files-found: warn

    - name: Publish test results to PR
      if: always()
      uses: dorny/test-reporter@v3
      with:
        name: Tests (Python ${{ matrix.python-version }})
        path: junit-py${{ matrix.python-version }}.xml
        reporter: java-junit
        fail-on-error: false

  examples-test:
    name: Test examples
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install example dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[test,xsa]"

    - name: Run executable example tests
      run: |
        pytest -v \
          test/devices/test_examples_smoke.py \
          test/devices/test_examples_ad9081_parity.py \
          test/test_examples_xsa_smoke.py \
          test/xsa/test_example_adrv9009_profile_file.py \
          test/xsa/test_example_fmcdaq2_zc706.py \
          test/test_jif_contract_examples.py \
          test/test_examples_ci_contract.py \
          --junitxml=junit-examples.xml

    - name: Pull canonical ADRV9009 Talise profile
      run: |
        python examples/xsa/adrv9009_profile_file.py \
          --talise-profile tx100-rx100-orx100 \
          --download-talise-profile \
          --output-dir "$RUNNER_TEMP/adrv9009-example"

    - name: Upload example JUnit XML
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: junit-examples
        path: junit-examples.xml
        retention-days: 14
        if-no-files-found: error

    - name: Publish example results to PR
      if: always()
      uses: dorny/test-reporter@v3
      with:
        name: Example Tests
        path: junit-examples.xml
        reporter: java-junit
        fail-on-error: false

  publish-pr-test-summary:
    name: PR Test Summary
    needs: [python-test, examples-test]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: junit-*
          path: junit
          merge-multiple: true

      - uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: 'junit/**/*.xml'
          check_name: 'Unit Test Results'
          comment_mode: always
          report_individual_runs: true

  build-package:
    needs: [python-test, examples-test]
    runs-on: ubuntu-latest
    name: Build Package for PyPI
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine wheel setuptools

    - name: Build source and wheel distribution
      run: |
        python -m build --sdist --wheel

    - name: Check built distributions
      run: |
        python -m twine check dist/*

    - name: Test installation from wheel
      run: |
        pip install dist/*.whl
        python -c "import adidt; print('Package installed successfully')"
        # Test CLI if available
        adidtc --help

    - name: Upload PyPI artifacts
      uses: actions/upload-artifact@v7
      with:
        name: pypi-distributions
        path: dist/
        retention-days: 90

    - name: Upload individual source distribution
      uses: actions/upload-artifact@v7
      with:
        name: source-distribution
        path: dist/*.tar.gz
        retention-days: 90

    - name: Upload individual wheel distribution
      uses: actions/upload-artifact@v7
      with:
        name: wheel-distribution
        path: dist/*.whl
        retention-days: 90
