name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Candidate v-prefixed tag to validate and dry-run from main
        required: true
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate tag and package versions
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          python .github/scripts/release_preflight.py --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

      - name: Verify release source belongs to main
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
              echo "Manual release dry runs must be dispatched from main" >&2
              exit 1
            }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          else
            [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" == "tag" ]] || {
              echo "Release tags must be annotated tags" >&2
              exit 1
            }
            TAG_SHA=$(git rev-list -n 1 "$RELEASE_TAG")
            git merge-base --is-ancestor "$TAG_SHA" origin/main
          fi

  test:
    name: Test Python ${{ matrix.python-version }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.validate.outputs.tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[test]"
      - run: pytest -q

  build:
    name: Build and inspect distributions
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.validate.outputs.tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Generate and verify SHA-256 distribution manifest
        run: |
          python .github/scripts/release_manifest.py generate --dir dist --output dist/SHA256SUMS
          python .github/scripts/release_manifest.py verify --manifest dist/SHA256SUMS --dir dist
      - name: Verify wheel in a clean environment
        run: |
          python -m venv /tmp/adidt-release-smoke
          /tmp/adidt-release-smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/adidt-release-smoke/bin/python -c \
            'import importlib.metadata as m, adidt; assert m.version("pyadi-dt") == adidt.__version__'
          /tmp/adidt-release-smoke/bin/adidtc --help >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          python .github/scripts/release_preflight.py --tag "$RELEASE_TAG" --notes-output release-notes.md
      - name: Upsert release, attach Python artifacts, and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          python .github/scripts/release_manifest.py upsert-release \
            --tag "$RELEASE_TAG" \
            --files dist/* \
            --notes-file release-notes.md \
            --title "$RELEASE_TAG"

  pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyadi-dt
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
